# Alembic configuration. The database URL is read from DATABASE_URL (see .env.example)
# by migrations/env.py; never put a URL in this file.
[alembic]
script_location = %(here)s/src/fantasy_helper/storage/migrations
prepend_sys_path = .
# Revisions are numbered by hand: uv run alembic revision --autogenerate --rev-id 0002 -m "..."
file_template = v%%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
