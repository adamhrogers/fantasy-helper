# Keeps the image the scheduled jobs and the API run (ADR 0025, 0029) building and starting, on any
# PR that could break it.
# Not a required check, so it isn't in main's ruleset or the auto-merge guard (ADR 0024).
name: Container

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - "src/**"
      - .github/workflows/container.yml

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway database for the migration check below (nothing in it is real).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fh
          POSTGRES_PASSWORD: fh
          POSTGRES_DB: fh_image
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fh -d fh_image"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Build
        run: docker build --tag fh:test .

      # The image has no .env and no secrets: these prove it installs and starts, and that the
      # scheduled command parses, without touching anything outside the runner.
      - name: Start
        run: |
          docker run --rm fh:test version
          docker run --rm fh:test snapshot --help
          docker run --rm fh:test run daily --help | grep -q require-snapshot-today
          [ "$(docker run --rm --entrypoint id fh:test -u)" != "0" ] || { echo "::error::the image runs as root"; exit 1; }

      # The deploy migrates prod with this image (ADR 0027), so the migration files have to ship
      # inside it. Migrate an empty database, check it again, and let the doctor confirm the head.
      - name: Migrations ship in the image
        env:
          DATABASE_URL: postgresql://fh:fh@localhost:5432/fh_image
        run: |
          run() { docker run --rm --network host -e DATABASE_URL "$@"; }
          run fh:test migrate | tee migrate.log
          grep -q "migrated an empty database to" migrate.log
          run fh:test migrate | grep -q "already at head"
          run fh:test doctor --only database

      # The API is the same image started with `serve` (ADR 0029). It has to start with only its
      # settings, and answer /livez, which needs no token and no database round trip.
      - name: The API starts and answers
        env:
          DATABASE_URL: postgresql://fh:fh@localhost:5432/fh_image
        run: |
          docker run --rm fh:test serve --help | grep -q 'Cloud Run'
          docker run -d --name api --network host -e DATABASE_URL \
            -e FH_SUPABASE_URL=https://example.supabase.co \
            -e FH_APP_ORIGINS=https://app.example.test fh:test serve
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/livez | grep -q '"status":"ok"'; then
              docker rm -f api >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs api
          exit 1
