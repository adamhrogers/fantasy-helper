# Merges Dependabot's PRs once CI passes, so dependency updates need no one (ADR 0024).
#
# This only *enables* GitHub's auto-merge: GitHub merges when main's required checks pass, and
# never if they fail. Without required checks, auto-merge could merge before CI finishes, so the
# first step refuses unless main's ruleset requires both CI jobs (runbooks/dependency-updates.md).
#
# Only updates to deploy.yml itself are left open for a person, even when CI passes: any action in
# the deploy job can ask GitHub for the token of the identity that deploys to prod (ADR 0028).
# Everything else merges itself, the Dockerfile and the phone app (web/) included (Adam's call,
# ADR 0024, Update 2026-11-23): but those two have checks that main's ruleset doesn't require
# (container.yml's image check, web.yml's app check), so a PR that changes them merges only after
# that check has passed too. A missing, failed or slow check leaves the PR open.
#
# No third-party actions: this job can write to the repo, so it runs only GitHub's own `gh`.
name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    name: Merge when CI passes
    # Dependabot's own PRs, from a branch in this repo (never a fork).
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25  # time for the app's or the image's check to finish (see below)
    permissions:
      contents: write       # auto-merge merges into main
      pull-requests: write  # and is set on the PR
      checks: read          # to wait for the image's or the app's check
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE: ${{ github.event.pull_request.base.ref }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Require CI on the base branch
        run: |
          missing=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/$BASE" --jq '
            [.[] | select(.type == "required_status_checks")
             | .parameters.required_status_checks[].context] as $required
            | ["Lint, types, contracts, tests", "Secret scan (full history)"] - $required
            | join(", ")')
          if [ -n "$missing" ]; then
            echo "::error::$BASE doesn't require these checks: $missing. Auto-merge could merge before CI passes, so this PR stays open. Add the ruleset in docs/runbooks/dependency-updates.md."
            exit 1
          fi

      - name: Leave updates to deploy.yml for a person; wait for the image's or the app's check
        id: deploy_path
        run: |
          # Two steps on purpose: if `gh` itself fails, this step fails and nothing merges. Only
          # grep's "no match" is allowed to be empty.
          files="$(gh pr diff "$PR_URL" --name-only)"
          held="$(printf '%s\n' "$files" | grep -E '^\.github/workflows/deploy\.yml$' || true)"
          if [ -n "$held" ]; then
            echo "::notice::this PR changes deploy.yml, so it stays open for a person to review"
            echo "hold=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Checks the ruleset doesn't require: wait until each has passed, or leave the PR open.
          need=()
          if printf '%s\n' "$files" | grep -qE '^(Dockerfile|\.dockerignore)$'; then
            need+=("Image builds and starts")
          fi
          if printf '%s\n' "$files" | grep -q '^web/'; then
            need+=("Types, lint, tests, build")
          fi
          for name in "${need[@]}"; do
            query="$(jq -rn --arg n "$name" '$n | @uri')"
            result=""
            for _ in $(seq 1 60); do
              result="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=$query" \
                --jq '[.check_runs[] | .status + ":" + (.conclusion // "")] | first // ""')"
              case "$result" in
                completed:success) break ;;
                completed:*) echo "::error::'$name' ended $result, so this PR stays open"; exit 1 ;;
              esac
              sleep 20
            done
            if [ "$result" != "completed:success" ]; then
              echo "::error::'$name' didn't pass within 20 minutes, so this PR stays open"
              exit 1
            fi
          done

      - name: Merge once the required checks pass
        if: steps.deploy_path.outputs.hold != 'true'
        run: gh pr merge --auto --squash "$PR_URL"
