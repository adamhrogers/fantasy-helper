# The morning chain and the evening snapshot, one job per line: job|cron|grace|trigger
#
#   job      the Cloud Run job, and the Healthchecks check, by this name
#   cron     when Healthchecks expects the job's chain to START, in Eastern time
#            (America/New_York). For a chained job this is when the CHAIN starts (the first
#            snapshot), not when the job itself runs, because a ping that arrives before a cron
#            time makes Healthchecks expect another one at it.
#   grace    seconds after that cron time before Healthchecks alerts. cron + grace is the alert
#            deadline: 06:17 + 5280 s = 07:45 for `daily` (the 8 a.m. promise's late-report
#            alert), and 06:17 + 6180 s = 08:00 for `weekly`.
#   trigger  what starts the job: `scheduler` (a Cloud Scheduler entry at that cron time), or
#            `after JOB` (the named job starts it when it finishes, ADR 0028). Nothing else does.
#
# Read by scripts/gcp-setup.sh (Cloud Scheduler entries and who may start what) and
# scripts/healthchecks-setup.sh (Healthchecks' schedules), so they can't disagree. The chain's
# env vars are set in .github/workflows/deploy.yml; tests/unit/test_workflows.py checks that the
# two agree.
snapshot-morning|17 6 * * *|1800|scheduler
snapshot-evening|17 17 * * *|1800|scheduler
daily|17 6 * * *|5280|after snapshot-morning
weekly|17 6 * * *|6180|after daily
