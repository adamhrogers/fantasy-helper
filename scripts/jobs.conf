# The scheduled jobs, one per line: job|cron|grace
#
#   job    the Cloud Run job, the Cloud Scheduler entry and the Healthchecks check, all by this name
#   cron   when it starts, in Eastern time (America/New_York); Cloud Scheduler handles daylight saving
#   grace  seconds Healthchecks waits after that before it alerts: a run that's late, never started,
#          or never finished. For `daily`, 3600 makes the alert come at 07:45 (the 8 a.m. promise).
#
# Read by scripts/gcp-setup.sh (Cloud Scheduler) and scripts/healthchecks-setup.sh (Healthchecks),
# so the two can't disagree about when a run is due. tests/unit/test_workflows.py checks that
# every job here is deployed by .github/workflows/deploy.yml.
snapshot-morning|17 6 * * *|1800
snapshot-evening|17 17 * * *|1800
daily|45 6 * * *|3600
weekly|0 7 * * *|3600
